<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#173f3b">
<title>鹈鹕的海边骑行 · Pelican on a Bicycle</title>
<style>
  :root {
    --ink: #143f3a;
    --ink-soft: #315b54;
    --cream: #fff8e8;
    --cream-soft: rgba(255, 248, 232, .64);
    --coral: #ea634e;
    --line: rgba(20, 63, 58, .22);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    overflow: hidden;
    background: #173f3b;
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      radial-gradient(130% 95% at 72% 26%, #f7ddba 0%, #c5ded3 48%, #173f3b 100%);
  }

  .stage > svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- editorial overlay ---------- */

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 3;
    padding: clamp(22px, 3.6vw, 52px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    pointer-events: none;
  }

  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .mark {
    flex: 0 0 auto;
    width: clamp(38px, 3.6vw, 50px);
    height: clamp(38px, 3.6vw, 50px);
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 249, 235, .66);
    border: 1px solid rgba(20, 63, 58, .3);
    box-shadow: 0 8px 24px rgba(32, 75, 68, .08);
    backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
  }

  .mark svg {
    width: 72%;
    height: 72%;
    overflow: visible;
  }

  .kicker {
    margin: 0 0 5px;
    color: var(--ink-soft);
    font-size: clamp(8px, .72vw, 10px);
    font-weight: 600;
    letter-spacing: .22em;
    line-height: 1.2;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-family: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, "Songti SC", serif;
    font-size: clamp(20px, 2.15vw, 33px);
    font-weight: 400;
    letter-spacing: -.025em;
    line-height: 1;
  }

  h1 em {
    position: relative;
    font-weight: 400;
    color: #b74336;
    white-space: nowrap;
  }

  h1 em::after {
    content: "";
    position: absolute;
    left: 1px;
    right: -2px;
    bottom: -.16em;
    height: 1px;
    background: rgba(183, 67, 54, .48);
    transform: rotate(-1.4deg);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 0 0 auto;
    margin-top: 4px;
    padding: 9px 15px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 248, 232, .33);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    font-size: clamp(8px, .7vw, 10px);
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .status b {
    font-weight: 700;
    color: var(--ink);
  }

  .sun-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #e9a248;
    box-shadow: 0 0 0 3px rgba(233, 162, 72, .18);
    animation: statusPulse 4.2s ease-in-out infinite;
  }

  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .note {
    margin: 0;
    font-family: "Songti SC", "STSong", "SimSun", "Iowan Old Style", Georgia, serif;
    color: var(--ink-soft);
  }

  .note p {
    margin: 0 0 10px;
    font-size: clamp(14px, 1.15vw, 17px);
    letter-spacing: .09em;
    line-height: 1.75;
  }

  .note span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .25em;
    text-transform: uppercase;
    opacity: .62;
  }

  .note span::before {
    content: "";
    width: 28px;
    height: 1px;
    background: currentColor;
    opacity: .6;
  }

  .transport {
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
  }

  .transport-label {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
    user-select: none;
  }

  .transport-label b {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
  }

  .transport-label small {
    font-size: 8px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    opacity: .47;
  }

  .toggle {
    position: relative;
    width: clamp(50px, 4.2vw, 58px);
    height: clamp(50px, 4.2vw, 58px);
    display: grid;
    place-items: center;
    border: 1px solid rgba(20, 63, 58, .32);
    border-radius: 50%;
    background: rgba(255, 248, 232, .72);
    color: var(--ink);
    cursor: pointer;
    outline: none;
    box-shadow: 0 10px 30px rgba(33, 77, 69, .1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1),
                background .3s ease, box-shadow .3s ease;
  }

  .toggle:hover {
    transform: scale(1.06);
    background: rgba(255, 250, 240, .94);
    box-shadow: 0 14px 36px rgba(33, 77, 69, .16);
  }

  .toggle:active { transform: scale(.96); }

  .toggle:focus-visible {
    box-shadow: 0 0 0 3px rgba(255, 248, 232, .9), 0 0 0 5px rgba(20, 63, 58, .6);
  }

  .toggle svg {
    width: 19px;
    height: 19px;
    display: block;
  }

  .icon-play { display: none; margin-left: 2px; }
  .is-paused .icon-pause { display: none; }
  .is-paused .icon-play { display: block; }

  .frame-line {
    position: fixed;
    inset: clamp(10px, 1.25vw, 18px);
    z-index: 2;
    border: 1px solid rgba(255, 248, 232, .2);
    border-radius: 2px;
    pointer-events: none;
  }

  .frame-line::before,
  .frame-line::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: rgba(255, 248, 232, .46);
  }

  .frame-line::before { left: -3px; top: -3px; }
  .frame-line::after { right: -3px; bottom: -3px; }

  /* ---------- ambient animation ---------- */

  .sun-pulse {
    transform-box: fill-box;
    transform-origin: center;
    animation: sunPulse 7.5s ease-in-out infinite;
  }

  .sun-rays {
    transform-origin: 920px 185px;
    animation: sunSpin 90s linear infinite;
  }

  .gull-inner {
    transform-box: fill-box;
    transform-origin: center;
    animation: gullBob 5.4s ease-in-out infinite;
  }

  .gull-inner:nth-child(2n) { animation-delay: -1.6s; }

  .boat-bob {
    transform-box: fill-box;
    transform-origin: center;
    animation: boatBob 6.4s ease-in-out infinite;
  }

  .sway {
    transform-box: fill-box;
    transform-origin: bottom center;
    animation: sway 6.8s ease-in-out infinite;
  }

  .sway.slow { animation-duration: 9.2s; animation-delay: -2.2s; }
  .sway.fast { animation-duration: 5.3s; animation-delay: -1.1s; }

  .mote {
    transform-box: fill-box;
    transform-origin: center;
    animation: moteFloat 12s linear infinite;
  }

  .sparkle {
    animation: sparkle 3.8s ease-in-out infinite;
  }

  .sparkle:nth-child(2n) { animation-delay: -1.4s; }
  .sparkle:nth-child(3n) { animation-delay: -2.5s; }

  .is-paused .stage *,
  .is-paused .sun-dot {
    animation-play-state: paused !important;
  }

  @keyframes sunPulse {
    0%, 100% { transform: scale(1); opacity: .44; }
    50% { transform: scale(1.07); opacity: .66; }
  }

  @keyframes sunSpin { to { transform: rotate(360deg); } }

  @keyframes gullBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  @keyframes boatBob {
    0%, 100% { transform: translateY(0) rotate(-.5deg); }
    50% { transform: translateY(4px) rotate(.8deg); }
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(3.2deg); }
  }

  @keyframes moteFloat {
    0% { transform: translate(0, 0) scale(.7); opacity: 0; }
    18% { opacity: .7; }
    75% { opacity: .5; }
    100% { transform: translate(22px, -120px) scale(1.1); opacity: 0; }
  }

  @keyframes sparkle {
    0%, 100% { opacity: .22; }
    50% { opacity: .86; }
  }

  @keyframes statusPulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(233, 162, 72, .18); }
    50% { box-shadow: 0 0 0 5px rgba(233, 162, 72, .08); }
  }

  @media (max-width: 760px) {
    .overlay { padding: 20px; }
    .status { display: none; }
    .brand { gap: 10px; }
    .mark { width: 36px; height: 36px; }
    .kicker { font-size: 7px; letter-spacing: .17em; }
    h1 { font-size: 18px; }
    .note { display: none; }
    .transport { margin-left: auto; }
    .transport-label small { display: none; }
    .frame-line { inset: 10px; }

    .stage::after {
      content: "";
      position: absolute;
      z-index: 1;
      top: 86px;
      right: -92px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle,
        #fff3ca 0 11%,
        #ffdfa1 11% 18%,
        rgba(255, 214, 145, .48) 36%,
        rgba(255, 200, 112, 0) 69%);
      filter: blur(3px);
      pointer-events: none;
    }
  }

  @media (max-height: 500px) {
    .note { display: none; }
    .overlay { padding: 18px 24px; }
    .kicker { display: none; }
    .mark { width: 34px; height: 34px; }
    h1 { font-size: 17px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sun-dot, .sun-pulse, .sun-rays, .gull-inner, .boat-bob,
    .sway, .mote, .sparkle {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="stage">
  <svg id="scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"
       role="img" aria-labelledby="sceneTitle sceneDesc">
    <title id="sceneTitle">一只鹈鹕骑着自行车穿过海边的步道</title>
    <desc id="sceneDesc">金色晨光下的二维动画：一只白色鹈鹕围着珊瑚色围巾，骑着青绿色自行车沿海边前行。车轮转动，双腿蹬踏，围巾随风飘动。</desc>

    <defs>

        <stop offset="1" stop-color="#f2c99f"/>

      <radialGradient id="sunBloom" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffe3a9" stop-opacity=".78"/>

        <stop offset="1" stop-color="#ffd18a" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="sunCore" cx=".42" cy=".38" r=".65">
        <stop offset="0" stop-color="#fff5cf"/>
        <stop offset=".58" stop-color="#ffdf9a"/>
        <stop offset="1" stop-color="#ffc36b"/>
      </radialGradient>

      <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8ac2b6"/>
        <stop offset=".42" stop-color="#5fa79e"/>
        <stop offset="1" stop-color="#377f7c"/>
      </linearGradient>

      <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f2dfbc"/>
        <stop offset=".45" stop-color="#ecd3aa"/>
        <stop offset="1" stop-color="#ddb985"/>
      </linearGradient>

      <linearGradient id="bodyGrad" x1=".2" y1="0" x2=".7" y2="1">
        <stop offset="0" stop-color="#fffef4"/>
        <stop offset=".56" stop-color="#fbf6e5"/>
        <stop offset="1" stop-color="#eee8d6"/>
      </linearGradient>

      <linearGradient id="wingGrad" x1=".1" y1="0" x2=".9" y2="1">
        <stop offset="0" stop-color="#fffdf2"/>

      <linearGradient id="beakGrad" x1="0" y1="0" x2=".8" y2=".5">

      <linearGradient id="pouchGrad" x1=".1" y1="0" x2=".65" y2="1">

        <stop offset=".6" stop-color="#f8bb5f"/>
        <stop offset="1" stop-color="#ed9c39"/>
      </linearGradient>

      <linearGradient id="frameGrad" x1="0" y1="0" x2=".4" y2="1">
        <stop offset="0" stop-color="#2b9689"/>
        <stop offset=".5" stop-color="#14736c"/>
        <stop offset="1" stop-color="#0d5754"/>
      </linearGradient>

      <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffe7a2" stop-opacity=".9"/>

        <stop offset="1" stop-color="#ffd477" stop-opacity="0"/>
      </radialGradient>

      <radialGradient id="vignette" cx=".5" cy=".46" r=".78">
        <stop offset=".56" stop-color="#163f3a" stop-opacity="0"/>
        <stop offset="1" stop-color="#123934" stop-opacity=".22"/>
      </radialGradient>

      <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">

      <filter id="tinyBlur" x="-80%" y="-80%" width="260%" height="260%">

      <filter id="grain" x="0" y="0" width="100%" height="100%">

        <feColorMatrix type="saturate" values="0"/>
        <feComponentTransfer>
          <feFuncA type="linear" slope=".55"/>
        </feComponentTransfer>
      </filter>

    <!-- sky -->

    <!-- sun -->

      <g class="cloud" data-x="760" data-y="73" data-speed="8.1" data-scale=".7">

      <g class="cloud" data-x="1080" data-y="148" data-speed="5.1" data-scale="1">

<script>
(() => {
  "use strict";

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const els = {
    cyclist: $("#cyclist"),
    rearSpokes: $("#rearSpokes"),
    frontSpokes: $("#frontSpokes"),
    crankFar: $("#crankFar"),
    crankNear: $("#crankNear"),
    nearPedal: $("#crankNear .pedal"),
    farPedal: $("#crankFar .pedal"),
    farLeg: $("#farLeg"),
    nearLeg: $("#nearLeg"),
    pelican: $("#pelican"),
    head: $("#pelicanHead"),
    eye: $("#eye"),
    pouch: $("#pouch"),
    chainLinks: $("#chainLinks"),
    groundScroll: $("#groundScroll"),
    seaScroll: $("#seaScroll"),
    scarf: {
      clip: $("#scarfClipPath"),
      outline: $("#scarfOutline"),
      fold: $("#scarfFold")
    },
    clouds: $$(".cloud").map((node, index) => ({
      node,
      x: Number(node.dataset.x),
      y: Number(node.dataset.y),
      speed: Number(node.dataset.speed),
      scale: Number(node.dataset.scale),
      index
    })),
    toggle: $("#toggle"),
    transportLabel: $("#transportLabel")
  };

  const state = {
    running: !reducedMotion,
    elapsed: 1.15,
    last: performance.now()
  };

  document.body.classList.toggle("is-paused", !state.running);

  function setRunning(running) {
    state.running = running;
    state.last = performance.now();
    document.body.classList.toggle("is-paused", !running);
    els.toggle.setAttribute("aria-pressed", String(!running));
    els.toggle.setAttribute("aria-label", running ? "暂停动画" : "播放动画");
    els.transportLabel.textContent = running ? "暂停" : "播放";
  }

  els.toggle.addEventListener("click", () => setRunning(!state.running));

  window.addEventListener("keydown", (event) => {
    if (event.code !== "Space" && event.key !== " ") return;
    const tag = event.target && event.target.tagName;
    if (tag === "BUTTON" || tag === "INPUT" || tag === "TEXTAREA" || tag === "A") return;
    event.preventDefault();
    setRunning(!state.running);
  });

  // On tall, narrow screens, step back a little so the whole bicycle stays in view.
  function layoutScene() {
    const aspect = window.innerWidth / window.innerHeight;
    let scale = 1;
    if (aspect < 0.85) {
      const visibleSceneWidth = 800 * aspect;
      scale = Math.min(1, visibleSceneWidth * 0.97 / 674);
    }
    els.cyclist.setAttribute(
      "transform",
      `translate(600 706) scale(${scale.toFixed(4)}) translate(-600 -706)`
    );
  }

  window.addEventListener("resize", layoutScene, { passive: true });
  layoutScene();

  function setLeg(leg, hip, foot) {
    const L1 = 112;
    const L2 = 119;
    const ankle = { x: foot.x, y: foot.y - 6 };
    let dx = ankle.x - hip.x;
    let dy = ankle.y - hip.y;
    let distance = Math.hypot(dx, dy);
    const maxDistance = L1 + L2 - 0.01;

    if (distance > maxDistance) {
      dx *= maxDistance / distance;
      dy *= maxDistance / distance;
      distance = maxDistance;
    }

    const baseAngle = Math.atan2(dy, dx);
    const cosine = Math.max(-1, Math.min(1,
      (L1 * L1 + distance * distance - L2 * L2) / (2 * L1 * distance)
    ));
    const alpha = Math.acos(cosine);
    const kneeAngle = baseAngle - alpha;
    const knee = {
      x: hip.x + Math.cos(kneeAngle) * L1,
      y: hip.y + Math.sin(kneeAngle) * L1
    };

    const thigh = leg.querySelector(".leg-thigh");
    const shin = leg.querySelector(".leg-shin");
    const kneeDot = leg.querySelector(".leg-knee");
    const footGroup = leg.querySelector(".leg-foot");

    function curvedSegment(a, b, bend) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const magnitude = Math.hypot(dx, dy) || 1;
      const cx = (a.x + b.x) / 2 - (dy / magnitude) * bend;
      const cy = (a.y + b.y) / 2 + (dx / magnitude) * bend;
      return `M ${a.x.toFixed(2)} ${a.y.toFixed(2)} Q ${cx.toFixed(2)} ${cy.toFixed(2)} ${b.x.toFixed(2)} ${b.y.toFixed(2)}`;
    }

    const thighPath = curvedSegment(hip, knee, 4.2);
    const shinPath = curvedSegment(knee, ankle, -2.4);

    thigh.setAttribute("d", thighPath);
    shin.setAttribute("d", shinPath);
    kneeDot.setAttribute("cx", knee.x.toFixed(2));
    kneeDot.setAttribute("cy", knee.y.toFixed(2));

    const tilt = Math.sin((foot.x + foot.y) * 0.018) * 3.2;
    footGroup.setAttribute("transform", `translate(${foot.x.toFixed(2)} ${(foot.y - 6).toFixed(2)}) rotate(${tilt.toFixed(2)})`);
  }

  function smoothPath(points) {
    if (!points.length) return "";
    let d = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)}`;
    for (let i = 1; i < points.length - 1; i++) {
      const x = (points[i][0] + points[i + 1][0]) / 2;
      const y = (points[i][1] + points[i + 1][1]) / 2;
      d += ` Q ${points[i][0].toFixed(2)} ${points[i][1].toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}`;
    }
    const end = points[points.length - 1];
    d += ` L ${end[0].toFixed(2)} ${end[1].toFixed(2)}`;
    return d;
  }

  function makeRibbonShape(time, startX, startY, length, phase, lift, baseWidth, tipWidth) {
    const steps = 17;
    const center = [];

    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const x = startX - length * u;
      const y = startY
        + lift * u
        + Math.sin(u * 4.1 + time * 3.15 + phase) * (2.5 + 13.5 * u)
        + Math.sin(u * 8.8 - time * 1.9 + phase * 1.7) * (1 + 3.8 * u);
      center.push([x, y]);
    }

    const top = [];
    const bottom = [];

    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const previous = center[Math.max(0, i - 1)];
      const next = center[Math.min(steps, i + 1)];
      const tx = next[0] - previous[0];
      const ty = next[1] - previous[1];
      const magnitude = Math.hypot(tx, ty) || 1;
      const nx = -ty / magnitude;
      const ny = tx / magnitude;
      const width = (baseWidth * (1 - u) + tipWidth * u) * (1 + 0.08 * Math.sin(u * 5.4 + phase));
      top.push([center[i][0] + nx * width * 0.5, center[i][1] + ny * width * 0.5]);
      bottom.push([center[i][0] - nx * width * 0.5, center[i][1] - ny * width * 0.5]);
    }

    const reversed = bottom.slice().reverse();
    let d = smoothPath(top);
    d += ` L ${reversed[0][0].toFixed(2)} ${reversed[0][1].toFixed(2)}`;

    for (let i = 1; i < reversed.length - 1; i++) {
      const x = (reversed[i][0] + reversed[i + 1][0]) / 2;
      const y = (reversed[i][1] + reversed[i + 1][1]) / 2;
      d += ` Q ${reversed[i][0].toFixed(2)} ${reversed[i][1].toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)}`;
    }

    const end = reversed[reversed.length - 1];
    d += ` L ${end[0].toFixed(2)} ${end[1].toFixed(2)} Z`;

    return {
      d,
      crease: smoothPath(center.map((point) => [point[0], point[1] + 1.5])),
      centerline: smoothPath(center)
    };
  }

  function render(time) {
    const crank = time * 2.05 + 0.52;
    const crankDegrees = crank * 180 / Math.PI;
    const wheelDegrees = (time * 144) % 360;

    // rolling wheels
    els.rearSpokes.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);
    els.frontSpokes.setAttribute("transform", `rotate(${wheelDegrees.toFixed(2)})`);

    // pedals turn while their platforms stay level
    const nearFoot = {
      x: 585 + Math.cos(crank) * 56,
      y: 590 + Math.sin(crank) * 56
    };
    const farAngle = crank + Math.PI;
    const farFoot = {
      x: 585 + Math.cos(farAngle) * 56,
      y: 590 + Math.sin(farAngle) * 56
    };

    els.crankNear.setAttribute("transform", `translate(585 590) rotate(${crankDegrees.toFixed(2)})`);
    els.nearPedal.setAttribute("transform", `translate(56 0) rotate(${(-crankDegrees).toFixed(2)})`);

    const farDegrees = crankDegrees + 180;
    els.crankFar.setAttribute("transform", `translate(585 590) rotate(${farDegrees.toFixed(2)})`);
    els.farPedal.setAttribute("transform", `translate(56 0) rotate(${(-farDegrees).toFixed(2)})`);

    // gentle body bob, driven by the pedal stroke
    const bob = Math.sin(crank * 2 + 0.25) * 2.2 + Math.sin(crank * 0.5) * 0.7;
    els.pelican.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);

    // the head lags just a little behind the body
    const headTilt = Math.sin(crank * 2 + 0.65) * 1.55 - 0.6;
    els.head.setAttribute("transform", `rotate(${headTilt.toFixed(2)} 685 252)`);

    // legs follow the pedals with simple two-bone IK
    setLeg(els.nearLeg, { x: 561, y: 414 + bob }, nearFoot);
    setLeg(els.farLeg, { x: 543, y: 407 + bob }, farFoot);

    // scarf lifts in the sea breeze and tapers toward its loose end
    const ribbon = makeRibbonShape(time, 638, 284, 218, 0.15, -42, 17, 3);
    els.scarf.clip.setAttribute("d", ribbon.d);
    els.scarf.outline.setAttribute("d", ribbon.d);
    els.scarf.fold.setAttribute("d", ribbon.crease);

    // blink roughly every four and a half seconds
    const blinkCycle = (time + 0.7) % 4.6;
    let eyeScale = 1;
    if (blinkCycle > 4.34) {
      const p = (blinkCycle - 4.34) / 0.26;
      eyeScale = 0.08 + Math.abs(Math.cos(p * Math.PI)) * 0.92;
    }
    const eyeY = 0.2 + Math.sin(time * 0.9) * 0.25;
    els.eye.setAttribute(
      "transform",
      `translate(${708 + eyeY} 198) scale(1 ${eyeScale.toFixed(3)}) translate(${-(708 + eyeY)} -198)`
    );

    // pouch gently jiggles with the road
    const pouchScale = 1 + Math.sin(crank * 2 + 1.2) * 0.008;
    els.pouch.setAttribute("transform", `translate(760 225) scale(1 ${pouchScale.toFixed(4)}) translate(-760 -225)`);

    // move the landscape under the wheels
    const groundOffset = -((time * 122) % 1200);
    const seaOffset = -((time * 21) % 1200);
    els.groundScroll.setAttribute("transform", `translate(${groundOffset.toFixed(2)} 0)`);
    els.seaScroll.setAttribute("transform", `translate(${seaOffset.toFixed(2)} 0)`);

    // chain links crawl around the drivetrain
    els.chainLinks.setAttribute("stroke-dashoffset", (-time * 38).toFixed(1));

    // slow cloud drift, wrapping around the wide scene
    const wrapWidth = 1680;
    els.clouds.forEach((cloud) => {
      let x = ((cloud.x - time * cloud.speed + 320) % wrapWidth + wrapWidth) % wrapWidth - 320;
      const y = cloud.y + Math.sin(time * 0.28 + cloud.index * 1.7) * 2.6;
      cloud.node.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${cloud.scale})`);
    });
  }

  function frame(now) {
    const dt = Math.min((now - state.last) / 1000, 0.05);
    state.last = now;
    if (state.running) {
      state.elapsed += dt;
      render(state.elapsed);
    }
    window.requestAnimationFrame(frame);
  }

  // reflect the initial play state (including reduced-motion preferences)
  if (!state.running) setRunning(false);

  // place everything before the first frame so cloud positions are never at the origin
  render(state.elapsed);
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
